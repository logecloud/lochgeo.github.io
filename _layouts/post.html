---
layout: default
---

<article class="post detailed">
  <h1>{{ page.title }}</h1>

  <div class="author_title">{{ page.date | date: "%B %e, %Y" }}</div>

  {% if page.tags.size > 0 %}
  <div class="post-tags">
    {% for tag in page.tags %}
      <a href="{{ site.baseurl }}/tag/{{ tag | slugify }}/">#{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}

  <div class="entry">
    {{ content }}
  </div>

  <div class="share-box">
    Share this post
  </div>
</article>
